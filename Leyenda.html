<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Matriz - Leyenda de Teclas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Burbuja de leyenda flotante */
        .matriz-bubble {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            animation: bubbleFloat 3s ease-in-out infinite;
        }

        @keyframes bubbleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Etiquetas de teclado sobre elementos */
        .keyboard-label {
            position: absolute;
            background: linear-gradient(135deg, #1a2b4b 0%, #2d4563 100%);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
            z-index: 10000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: labelFadeIn 0.3s ease-out;
        }

        @keyframes labelFadeIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(-5px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Elemento interactivo resaltado */
        .matriz-active {
            outline: 2px dashed #78C043;
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* Pulsing highlight */
        @keyframes matrizPulse {
            0%, 100% { outline-color: #78C043; }
            50% { outline-color: rgba(120, 192, 67, 0.5); }
        }

        .matriz-active {
            animation: matrizPulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <!-- Burbuja de Leyenda del Modo Matriz -->
    <div id="matriz-bubble" class="matriz-bubble hidden">
        <div class="bg-gradient-to-br from-[#1a2b4b] to-[#2d4563] text-white rounded-2xl shadow-2xl p-6 max-w-xs border border-[#78C043]/30">
            <div class="flex items-start gap-3">
                <span class="text-7xl">⌨️</span>
                <div>
                    <h3 class="font-bold text-lg mb-2 text-[#78C043]">Modo Matriz Activo</h3>
                    <p class="text-xs text-slate-300 mb-3">Las combinaciones de teclas aparecen sobre elementos interactivos.</p>
                    <div class="bg-white/10 p-2 rounded-lg">
                        <p class="text-xs font-mono text-[#78C043]">Presiona QA para desactivar</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === SISTEMA DE MODO MATRIZ ===
        
        let matrizMode = false;
        let keySequence = [];
        const matrizKey = ['q', 'a']; // Combinación QA para activar/desactivar
        const keyTimeout = 500; // Milisegundos entre teclas
        let lastKeyTime = 0;

        // Mapeo de elementos interactivos y sus atajos
        const interactiveElements = [
            { selector: '#searchInput', keys: 'CTRL + F', description: 'Buscar' },
            { selector: 'button[onclick*="toggleFilters"]', keys: 'SHIFT + 3', description: 'Filtros' },
            { selector: 'button[onclick*="toggleCommands"]', keys: 'Shift + ?', description: 'Atajos' },
            { selector: 'button[onclick*="resetFilters"]', keys: 'CTRL + R', description: 'Limpiar' },
            { selector: '[onclick*="window.location.href"]', keys: 'ENTER', description: 'Ver Producto' },
        ];

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            setupMatrizMode();
        });

        // === CONFIGURAR MODO MATRIZ ===
        function setupMatrizMode() {
            document.addEventListener('keydown', handleKeyDown);
        }

        // === MANEJAR PULSACIÓN DE TECLA ===
        function handleKeyDown(e) {
            const key = e.key.toLowerCase();
            const now = Date.now();

            // Reiniciar secuencia si pasó demasiado tiempo
            if (now - lastKeyTime > keyTimeout) {
                keySequence = [];
            }
            lastKeyTime = now;

            // Agregar tecla a la secuencia
            keySequence.push(key);

            // Verificar si coincide con la combinación
            if (keySequence.length >= matrizKey.length) {
                const lastKeys = keySequence.slice(-matrizKey.length);
                if (lastKeys.join('') === matrizKey.join('')) {
                    e.preventDefault();
                    toggleMatrizMode();
                    keySequence = [];
                }
            }
        }

        // === ALTERNAR MODO MATRIZ ===
        function toggleMatrizMode() {
            matrizMode = !matrizMode;
            const bubble = document.getElementById('matriz-bubble');

            if (matrizMode) {
                bubble.classList.remove('hidden');
                activateMatrizLabels();
                console.log('✨ Modo Matriz ACTIVADO');
            } else {
                bubble.classList.add('hidden');
                deactivateMatrizLabels();
                console.log('❌ Modo Matriz DESACTIVADO');
            }
        }

        // === ACTIVAR ETIQUETAS ===
        function activateMatrizLabels() {
            // Eliminar etiquetas previas
            document.querySelectorAll('.keyboard-label').forEach(label => label.remove());

            // Elementos estándares
            const standardElements = [
                { selector: '#searchInput', keys: 'CTRL+F', text: 'Buscar' },
                { selector: 'button[title*="Filtros"]', keys: 'SHIFT+3', text: 'Filtros' },
                { selector: '#commands-modal button', keys: '?', text: 'Cerrar' },
            ];

            standardElements.forEach(({ selector, keys, text }) => {
                const elements = document.querySelectorAll(selector);
                elements.forEach(el => {
                    if (el.offsetParent !== null) { // Solo si es visible
                        addKeyLabel(el, keys, text);
                        el.classList.add('matriz-active');
                    }
                });
            });

            // Botones de producto
            document.querySelectorAll('[onclick*="window.location.href"]').forEach(el => {
                if (el.offsetParent !== null) {
                    addKeyLabel(el, 'ENTER', 'Ver');
                    el.classList.add('matriz-active');
                }
            });

            // Botones de acción
            document.querySelectorAll('button[onclick*="toggleFilters"]').forEach(el => {
                if (el.offsetParent !== null && !el.parentElement.querySelector('.keyboard-label')) {
                    addKeyLabel(el, 'F', 'Filtros');
                    el.classList.add('matriz-active');
                }
            });

            document.querySelectorAll('button[onclick*="resetFilters"]').forEach(el => {
                if (el.offsetParent !== null) {
                    addKeyLabel(el, 'R', 'Limpiar');
                    el.classList.add('matriz-active');
                }
            });
        }

        // === DESACTIVAR ETIQUETAS ===
        function deactivateMatrizLabels() {
            document.querySelectorAll('.keyboard-label').forEach(label => label.remove());
            document.querySelectorAll('.matriz-active').forEach(el => {
                el.classList.remove('matriz-active');
            });
        }

        // === AGREGAR ETIQUETA DE TECLA A UN ELEMENTO ===
        function addKeyLabel(element, keys, description = '') {
            const label = document.createElement('div');
            label.className = 'keyboard-label';
            label.textContent = `⌨️ ${keys}`;
            label.title = description;

            // Posicionar en la esquina superior derecha del elemento
            const rect = element.getBoundingClientRect();
            label.style.position = 'fixed';
            label.style.top = (rect.top - 25) + 'px';
            label.style.left = (rect.right - 80) + 'px';

            document.body.appendChild(label);

            // Reposicionar si es necesario
            setTimeout(() => {
                const labelRect = label.getBoundingClientRect();
                if (labelRect.top < 0) {
                    label.style.top = rect.top + 5 + 'px';
                }
                if (labelRect.right > window.innerWidth) {
                    label.style.left = (rect.left - 5) + 'px';
                    label.style.transform = 'translateX(-100%)';
                }
            }, 0);
        }

        // === EXPORTAR FUNCIÓN PARA USO GLOBAL ===
        window.getMatrizMode = () => matrizMode;
        window.toggleMatrizMode = toggleMatrizMode;
    </script>

</body>
</html>
