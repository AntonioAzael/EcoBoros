<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOBOROS - Cargando...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos de carga */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loader-container {
            text-align: center;
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #78C043;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: #1a2b4b;
        }
        
        .logo-text span {
            color: #78C043;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <img src="Public/Imagenes/Logo.png" alt="ECOBOROS" class="h-20 w-auto mx-auto mb-4 drop-shadow-sm" onerror="this.src='https://placehold.co/200x80/1a2b4b/78C043?text=ECOBOROS'">
        <div class="spinner"></div>
        <p class="logo-text">ECOBOROS <span>♻️</span></p>
        <p class="subtitle">Redirigiendo...</p>
    </div>

    <script>
        /**
         * ============================================
         * INDEX.JS - Punto de entrada principal
         * ============================================
         * Este script verifica si el usuario tiene
         * sesión activa y lo redirige automáticamente
         * a la página correspondiente.
         */
        
        (function() {
            'use strict';

            // ========== MAPA DE ROLES A RUTAS ==========
            const ROUTES = {
                'admin': 'Components/admin/admin.html',
                'calidad': 'Components/calidad/calidad.html',
                'empresa': 'Components/empresa/empresa.html',
                'invitado': 'Components/login/login.html'
            };

            // ========== OBTENER USUARIO DE SESIÓN ==========
            function getSessionUser() {
                // Primero buscar en localStorage, luego en sessionStorage
                const stored = localStorage.getItem('ecoboros_user') || sessionStorage.getItem('ecoboros_user');
                if (stored) {
                    try {
                        return JSON.parse(stored);
                    } catch (e) {
                        console.warn('Error al parsear sesión:', e);
                        return null;
                    }
                }
                return null;
            }

            // ========== VALIDAR SESIÓN ==========
            function isValidSession(user) {
                if (!user) return false;
                
                // Verificar que tenga los campos mínimos
                if (!user.role || !user.loggedIn) return false;
                
                // Verificar que el rol sea válido
                const validRoles = ['admin', 'calidad', 'empresa'];
                if (!validRoles.includes(user.role)) return false;
                
                // Verificar que la sesión no sea demasiado vieja (7 días)
                const maxAge = 7 * 24 * 60 * 60 * 1000; // 7 días en milisegundos
                if (user.timestamp) {
                    const age = Date.now() - user.timestamp;
                    if (age > maxAge) {
                        // Sesión expirada, limpiar
                        localStorage.removeItem('ecoboros_user');
                        sessionStorage.removeItem('ecoboros_user');
                        return false;
                    }
                }
                
                return true;
            }

            // ========== REDIRIGIR ==========
            function redirectTo(url) {
                // Asegurar que la URL sea absoluta desde la raíz
                if (url.startsWith('/')) {
                    url = url.substring(1);
                }
                // Redirigir con un pequeño delay para que se vea el splash
                setTimeout(() => {
                    window.location.href = url;
                }, 600);
            }

            // ========== MAIN ==========
            function main() {
                const user = getSessionUser();
                
                // Determinar la ruta de destino
                let destination;
                
                if (isValidSession(user)) {
                    // Usuario con sesión válida - ir a su panel
                    destination = ROUTES[user.role];
                    if (!destination) {
                        // Si el rol no está mapeado, ir a login por seguridad
                        destination = ROUTES['invitado'];
                    }
                } else {
                    // Sin sesión válida - ir a login
                    destination = ROUTES['invitado'];
                    // Limpiar cualquier dato de sesión corrupto
                    localStorage.removeItem('ecoboros_user');
                    sessionStorage.removeItem('ecoboros_user');
                }
                
                // Redirigir
                redirectTo(destination);
            }

            // ========== EJECUTAR ==========
            // Esperar a que el DOM esté listo
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', main);
            } else {
                main();
            }

        })();
    </script>
</body>
</html>
