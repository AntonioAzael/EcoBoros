services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - ecoboros_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecoboros"]
      interval: 5s
      timeout: 5s
      retries: 5


  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./back:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_NAME=ecoboros
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=eco472
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  ecoboros_pgdata: